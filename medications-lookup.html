<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medications Lookup</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8fa;
    --border: #e3e6eb;
    --border-strong: #c9cfd8;
    --text: #1a2332;
    --text-muted: #5a6578;
    --accent: #1e4d8c;          /* generic default — overridden by the account's brand color */
    --accent-hover: #163a6c;    /* default, 12% darker — recomputed when the brand color resolves */
    --danger: #c94545;
    --danger-hover: #a83838;
    --success: #2d7a4f;
    --warning-bg: #fff8e6;
    --warning-border: #e8c96b;
    --radius: 6px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    margin: 0;
    padding: 24px;
    font-size: 15px;
    line-height: 1.5;
  }

  .meds-container {
    max-width: 100%;
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }

  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 4px; font-weight: 600; }
  .subtitle { color: var(--text-muted); margin-bottom: 28px; font-size: 14px; }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .section-title { font-size: 16px; font-weight: 600; margin: 0; }
  .section-count { color: var(--text-muted); font-size: 13px; }

  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 9px 12px;
    font-size: 14px;
    font-family: var(--font);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  /* validation cue for a required "Other — please specify" field left blank */
  input.err, select.err { border-color: var(--danger); }
  input.err:focus, select.err:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); }

  .search-wrap { position: relative; }

  .search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    max-height: 360px;
    overflow-y: auto;
    z-index: 20;
    display: none;
  }
  .search-results.open { display: block; }

  .result-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover, .result-item.active { background: #eef5f7; }
  .result-item .name { font-weight: 500; }
  .result-item .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .result-empty { padding: 14px 12px; font-size: 13px; color: var(--text-muted); text-align: center; }
  .result-empty a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  .rx-row { display: flex; gap: 10px; align-items: end; }
  .rx-row > * { flex: 1; }

  button {
    font-family: var(--font);
    font-size: 14px;
    padding: 9px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: #fff;
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: var(--surface); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger-text { background: transparent; border: none; color: var(--danger); padding: 4px 8px; font-size: 13px; }
  button.danger-text:hover { color: var(--danger-hover); background: transparent; }

  .items-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }

  .item-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .item-card.manual { background: var(--warning-bg); border-color: var(--warning-border); }
  .item-card-main { flex: 1; min-width: 0; }
  .item-card-name { font-weight: 500; font-size: 14px; }
  .item-card-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .item-card-badge {
    display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 3px;
    background: #e3a23a; color: #fff; margin-left: 6px;
    text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600;
  }

  .manual-entry-box { background: #fff; border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
  .manual-entry-box h4 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }

  .field-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .field-group.single { grid-template-columns: 1fr; }

  .actions-right { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

  .loading-inline { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-muted); }

  .help-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .help-text a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<div class="meds-container">
  <p class="subtitle">Add any prescriptions you take. Search by drug name, or enter one manually.</p>

  <!-- ============ MEDICATIONS ============ -->
  <div class="section" id="medications-section">
    <div class="section-header">
      <h2 class="section-title">Medications</h2>
      <span class="section-count" id="med-count">0 of 20</span>
    </div>

    <div id="med-search-block">
      <label for="med-search">Search for a medication</label>
      <div class="search-wrap">
        <input type="text" id="med-search" placeholder="Start typing a drug name, e.g. Lipitor" autocomplete="off">
        <div class="loading-inline" id="med-loading" style="display:none;">Searching…</div>
        <div class="search-results" id="med-results"></div>
      </div>
      <p class="help-text">Can't find your medication? <a id="med-manual-toggle">Enter it manually</a></p>
    </div>

    <div id="med-strength-block" style="display:none; margin-top:14px;">
      <label for="med-strength">Select strength &amp; form</label>
      <select id="med-strength"></select>
      <div class="rx-row" style="margin-top:10px;">
        <div>
          <label for="med-frequency">Frequency</label>
          <select id="med-frequency">
            <option value="Once daily">Once daily</option>
            <option value="Twice daily">Twice daily</option>
            <option value="Three times daily">Three times daily</option>
            <option value="Four times daily">Four times daily</option>
            <option value="Every other day">Every other day</option>
            <option value="As needed">As needed</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label for="med-applicant">Who takes this? (optional)</label>
          <input type="text" id="med-applicant" placeholder="e.g. John Smith" autocomplete="off">
        </div>
      </div>
      <!-- Shown only when Frequency = "Other". Free text folds into the frequency
           string written to the summary/JSON — no separate CRM field. -->
      <div id="med-freq-other-wrap" style="display:none; margin-top:10px;">
        <label for="med-freq-other">Please specify how often</label>
        <input type="text" id="med-freq-other" placeholder="e.g. Once weekly, Every 3 months" autocomplete="off">
      </div>
      <!-- Quantity and days supply are optional PRICING inputs, deliberately with no default.
           A drug's cost is quantity times days supply, so a fabricated value is worse than a
           blank one. Days supply is a fixed list because the receiving side treats it as a
           refill cadence (30 days reads as "every month"), and off-cycle values map
           unpredictably. -->
      <div class="rx-row" style="margin-top:10px;">
        <div>
          <label for="med-quantity">Quantity per fill (optional)</label>
          <input type="number" id="med-quantity" min="1" max="999" step="1" placeholder="e.g. 30" autocomplete="off">
        </div>
        <div>
          <label for="med-days-supply">Days supply (optional)</label>
          <select id="med-days-supply">
            <option value="">Not specified</option>
            <option value="30">30 days</option>
            <option value="60">60 days</option>
            <option value="90">90 days</option>
          </select>
        </div>
      </div>
      <div class="actions-right">
        <button type="button" id="med-cancel">Cancel</button>
        <button type="button" class="primary" id="med-add">Add medication</button>
      </div>
    </div>

    <div id="med-manual-block" class="manual-entry-box" style="display:none;">
      <h4>Manual medication entry</h4>
      <div class="field-group single">
        <div>
          <label>Medication name</label>
          <input type="text" id="med-manual-name" placeholder="e.g. Compounded hormone cream">
        </div>
      </div>
      <div class="field-group">
        <div>
          <label>Strength (optional)</label>
          <input type="text" id="med-manual-strength" placeholder="e.g. 10 mg">
        </div>
        <div>
          <label>Form (optional)</label>
          <input type="text" id="med-manual-form" placeholder="e.g. tablet, cream">
        </div>
      </div>
      <div class="field-group">
        <div>
          <label>Frequency</label>
          <select id="med-manual-frequency">
            <option value="Once daily">Once daily</option>
            <option value="Twice daily">Twice daily</option>
            <option value="Three times daily">Three times daily</option>
            <option value="Four times daily">Four times daily</option>
            <option value="Every other day">Every other day</option>
            <option value="As needed">As needed</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label for="med-manual-applicant">Who takes this? (optional)</label>
          <input type="text" id="med-manual-applicant" placeholder="e.g. John Smith" autocomplete="off">
        </div>
      </div>
      <!-- Shown only when Frequency = "Other" (manual path). Same fold behavior. -->
      <div class="field-group single" id="med-manual-freq-other-wrap" style="display:none;">
        <div>
          <label for="med-manual-freq-other">Please specify how often</label>
          <input type="text" id="med-manual-freq-other" placeholder="e.g. Once weekly, Every 3 months" autocomplete="off">
        </div>
      </div>
      <!-- Same optional pricing inputs as the search path. See the comment there. -->
      <div class="field-group">
        <div>
          <label for="med-manual-quantity">Quantity per fill (optional)</label>
          <input type="number" id="med-manual-quantity" min="1" max="999" step="1" placeholder="e.g. 30" autocomplete="off">
        </div>
        <div>
          <label for="med-manual-days-supply">Days supply (optional)</label>
          <select id="med-manual-days-supply">
            <option value="">Not specified</option>
            <option value="30">30 days</option>
            <option value="60">60 days</option>
            <option value="90">90 days</option>
          </select>
        </div>
      </div>
      <div class="actions-right">
        <button type="button" id="med-manual-cancel">Cancel</button>
        <button type="button" class="primary" id="med-manual-add">Add medication</button>
      </div>
    </div>

    <div class="items-list" id="med-list"></div>
  </div>

  <!-- Fallback placeholders so the widget still syncs when used standalone. -->
  <input type="hidden" name="medications_json">
  <input type="hidden" name="medications_summary">
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const MAX_MEDS = 20;
const DEBOUNCE_MS = 300;
const RX_BASE = 'https://rxnav.nlm.nih.gov/REST';

// Output field-key mapping. Each output is written to the GHL field whose clean
// key matches — the field's Unique Key, surfaced as the input name= (and data-q)
// on the rendered form. We match by clean key only, with NO hardcoded field IDs,
// so this widget is snapshot-portable: drop it into any sub-account whose form
// has fields with these keys and it connects automatically.
// Override via window.MEDS_CONFIG = { fieldKeys: { medications_summary: [...] } }.
const FIELD_KEYS = Object.assign({
  medications_json:    ['medications_json'],
  medications_summary: ['medications_summary']
}, (typeof window !== 'undefined' && window.MEDS_CONFIG && window.MEDS_CONFIG.fieldKeys) || {});

// ============================================================
// STATE
// ============================================================
const state = { medications: [], medPending: null };

// Gates the very first (bootstrap) sync. We hydrate state from any existing
// field value, then paint once WITHOUT writing back, so a prefilled field is
// never clobbered by the empty initial render. Flipped true after bootstrap;
// every user-driven render thereafter syncs normally (append, not replace).
let syncReady = false;

// ============================================================
// UTILITIES
// ============================================================
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ============================================================
// SEARCH PROVIDER: RxNorm (public) or HealthSherpa (module only)
// ============================================================
// Two providers, one UI. The chooser is a single config value.
//
// 🩸 WHY THE SPLIT EXISTS AND MUST STAY: the HealthSherpa search needs an
// External API token, which can NEVER ship to a browser. So the HS path goes
// through a same-origin proxy that only the authenticated MODULE surface has.
// Funnel embeds are public and have no proxy, so they keep RxNorm. Setting
// window.MEDS_CONFIG.rxSearchUrl is what opts a surface into HS mode; leaving
// it unset is the default and is byte-for-byte today's behaviour.
//
// 🩸 WHY HS MODE CANNOT ALSO KEEP rxcui: HealthSherpa's search response carries
// NO code system at all (their fields are id, product_proprietary_name,
// product_proprietary_name_without_dosage, substance_name, dosage_variations).
// HS drug ids and RxNorm rxcui are DISJOINT namespaces, verified against NLM
// RxNav. Matching one to the other could only be done on drug NAME, which is a
// fuzzy join sitting underneath a coverage claim, so we do not do it. An HS
// capture therefore carries hs_rx_id and a null rxcui, and `source` records
// which generation the row came from.
const RX_SEARCH_URL = (typeof window !== 'undefined' && window.MEDS_CONFIG
  && typeof window.MEDS_CONFIG.rxSearchUrl === 'string'
  && window.MEDS_CONFIG.rxSearchUrl.trim()) || null;

function usingHealthSherpaSearch() { return !!RX_SEARCH_URL; }

// Search results are held here rather than serialized into data- attributes.
// HealthSherpa entities carry a nested dosage_variations array that has no sane
// attribute encoding, and an index keeps the click handler identical for both
// providers.
let lastResults = [];

// ---- HealthSherpa -------------------------------------------------------
async function searchMedicationsHS(query) {
  try {
    const url = `${RX_SEARCH_URL}${RX_SEARCH_URL.includes('?') ? '&' : '?'}q=${encodeURIComponent(query)}`;
    const res = await fetch(url, { credentials: 'same-origin' });
    if (!res.ok) {
      // A 503 means the External API token is not configured yet, which is the
      // expected state until HealthSherpa issues it. Everything else is a real
      // failure. Either way the agent gets the manual-entry path, never a
      // broken box.
      console.error('HealthSherpa drug search failed:', res.status);
      return [];
    }
    const data = await res.json();
    const entities = (data && Array.isArray(data.entities)) ? data.entities : [];
    return entities.map(e => ({
      provider: 'healthsherpa',
      hs_rx_id: e.id != null ? String(e.id) : null,
      // Label the RESULT with the dosage-free name: it is the product family,
      // which is what someone is picking at this step.
      name: e.product_proprietary_name_without_dosage || e.product_proprietary_name || '',
      full_name: e.product_proprietary_name || '',
      // 🩸 substance_name is a CATEGORY ("Branded / Pen Injector"), NOT an
      // ingredient. It must never be mapped to a brand_name-style field.
      category: e.substance_name || null,
      variations: Array.isArray(e.dosage_variations) ? e.dosage_variations : []
    })).filter(r => r.hs_rx_id);
  } catch (e) {
    console.error('HealthSherpa drug search failed:', e);
    return [];
  }
}

// 🩸 Their dosage list is INCONSISTENT about whether the parent appears in its
// own variations: HS's documented example has entity 12611 listing itself while
// 12612 lists only 12613 and omits its own dosage. So build the picker as
// union(parent, variations) DEDUPED BY ID, or a real strength silently
// disappears from the list.
//
// 🩸 And label with product_proprietary_name, never the _without_dosage form:
// that field is NOT unique across variations (HS's own example has 12612 and
// 12613 sharing a byte-identical one), so labelling with it renders every
// option the same and the agent picks blind.
function dosageOptionsHS(entity) {
  const out = [];
  const seen = new Set();
  const push = (v) => {
    if (!v || v.id == null) return;
    const id = String(v.id);
    if (seen.has(id)) return;
    seen.add(id);
    out.push({
      hs_rx_id: id,
      name: v.product_proprietary_name || v.product_proprietary_name_without_dosage || id,
      type: 'HS'
    });
  };
  push({ id: entity.hs_rx_id, product_proprietary_name: entity.full_name || entity.name });
  (entity.variations || []).forEach(push);
  return out;
}

// ============================================================
// MEDICATION SEARCH (RxNorm)
// ============================================================
async function searchMedications(query) {
  if (!query || query.length < 2) return [];
  try {
    const url = `${RX_BASE}/approximateTerm.json?term=${encodeURIComponent(query)}&maxEntries=8`;
    const res = await fetch(url);
    const data = await res.json();
    const candidates = (data.approximateGroup && data.approximateGroup.candidate) || [];
    const seen = new Map();
    for (const c of candidates) {
      if (!c.rxcui) continue;
      if (!seen.has(c.rxcui)) seen.set(c.rxcui, c);
    }
    const withNames = await Promise.all(Array.from(seen.values()).slice(0, 6).map(async c => {
      if (c.name) return c;
      try {
        const nameRes = await fetch(`${RX_BASE}/rxcui/${c.rxcui}/property.json?propName=RxNorm%20Name`);
        const nameData = await nameRes.json();
        const props = nameData.propConceptGroup && nameData.propConceptGroup.propConcept;
        return { ...c, name: (props && props[0] && props[0].propValue) || `RxCUI ${c.rxcui}` };
      } catch { return { ...c, name: `RxCUI ${c.rxcui}` }; }
    }));
    return withNames;
  } catch (e) {
    console.error('RxNorm search failed:', e);
    return [];
  }
}

async function getDrugDetails(rxcui) {
  try {
    const url = `${RX_BASE}/rxcui/${rxcui}/allrelated.json`;
    const res = await fetch(url);
    const data = await res.json();
    const groups = (data.allRelatedGroup && data.allRelatedGroup.conceptGroup) || [];
    const drugForms = [];
    const brands = new Set();
    for (const g of groups) {
      if ((g.tty === 'SCD' || g.tty === 'SBD') && g.conceptProperties) {
        for (const p of g.conceptProperties) drugForms.push({ rxcui: p.rxcui, name: p.name, type: g.tty });
      }
      if (g.tty === 'BN' && g.conceptProperties) {
        for (const p of g.conceptProperties) brands.add(p.name);
      }
    }
    const uniq = new Map();
    for (const f of drugForms) {
      const key = f.name.toLowerCase().replace(/^\[brand\]/, '').trim();
      if (!uniq.has(key)) uniq.set(key, f);
    }
    return { strengthOptions: Array.from(uniq.values()), brandNames: Array.from(brands) };
  } catch (e) {
    console.error('RxNorm details failed:', e);
    return { strengthOptions: [], brandNames: [] };
  }
}

async function getNdcForRxcui(rxcui) {
  try {
    const url = `${RX_BASE}/rxcui/${rxcui}/ndcs.json`;
    const res = await fetch(url);
    const data = await res.json();
    const ndcs = (data.ndcGroup && data.ndcGroup.ndcList && data.ndcGroup.ndcList.ndc) || [];
    return ndcs[0] || null;
  } catch (e) { return null; }
}

function parseDrugName(name) {
  const strengthMatch = name.match(/(\d+(?:\.\d+)?)\s*(MG|MCG|ML|G|%|UNIT)/i);
  const strength = strengthMatch ? `${strengthMatch[1]} ${strengthMatch[2].toLowerCase()}` : null;
  const formPatterns = ['Tablet', 'Capsule', 'Injection', 'Solution', 'Suspension',
                        'Cream', 'Ointment', 'Patch', 'Inhaler', 'Syrup', 'Drops',
                        'Suppository', 'Gel', 'Spray'];
  let dosageForm = null;
  for (const p of formPatterns) {
    if (name.toLowerCase().includes(p.toLowerCase())) { dosageForm = p.toLowerCase(); break; }
  }
  return { strength, dosageForm };
}

// ============================================================
// MEDICATION UI
// ============================================================
const medSearchInput = document.getElementById('med-search');
const medResults = document.getElementById('med-results');
const medLoading = document.getElementById('med-loading');
const medStrengthBlock = document.getElementById('med-strength-block');
const medStrengthSelect = document.getElementById('med-strength');
const medManualBlock = document.getElementById('med-manual-block');
const medSearchBlock = document.getElementById('med-search-block');

// "Other" frequency → reveal a free-text field, on both the search and manual paths.
const medFreqSelect = document.getElementById('med-frequency');
const medFreqOtherWrap = document.getElementById('med-freq-other-wrap');
const medFreqOther = document.getElementById('med-freq-other');
const medManualFreqSelect = document.getElementById('med-manual-frequency');
const medManualFreqOtherWrap = document.getElementById('med-manual-freq-other-wrap');
const medManualFreqOther = document.getElementById('med-manual-freq-other');

function toggleFreqOther(select, wrap, input) {
  const isOther = select.value === 'Other';
  wrap.style.display = isOther ? '' : 'none';
  if (isOther) { input.focus(); }
  else { input.value = ''; input.classList.remove('err'); }
}
medFreqSelect.addEventListener('change', () => toggleFreqOther(medFreqSelect, medFreqOtherWrap, medFreqOther));
medManualFreqSelect.addEventListener('change', () => toggleFreqOther(medManualFreqSelect, medManualFreqOtherWrap, medManualFreqOther));
medFreqOther.addEventListener('input', () => medFreqOther.classList.remove('err'));
medManualFreqOther.addEventListener('input', () => medManualFreqOther.classList.remove('err'));

// Resolve a frequency select + its "Other" specify field into the final string.
// Returns null (and flags the field) when "Other" is chosen but left blank.
function resolveFreq(select, input) {
  if (select.value !== 'Other') return select.value;
  const t = input.value.trim();
  if (!t) { input.classList.add('err'); input.focus(); return null; }
  return t;
}

// Coerce to a positive integer, or null. Used for both quantity and days supply so a blank,
// a zero, or junk all collapse to the same "not captured" value rather than a misleading 0.
function posInt(v) {
  const n = parseInt(String(v == null ? '' : v).trim(), 10);
  return Number.isFinite(n) && n > 0 ? n : null;
}

// Read the optional quantity + days-supply pair off either entry path. Never substitutes a
// default: these two are what a drug's cost is computed from, so an invented value would be
// indistinguishable from one the agent actually confirmed.
function readQtyDays(qtyId, daysId) {
  return {
    quantity: posInt(document.getElementById(qtyId).value),
    days_supply: posInt(document.getElementById(daysId).value)
  };
}

const runMedSearch = debounce(async (q) => {
  if (!q || q.length < 2) {
    medResults.classList.remove('open');
    medLoading.style.display = 'none';
    return;
  }
  medLoading.style.display = 'block';
  const results = usingHealthSherpaSearch()
    ? await searchMedicationsHS(q)
    : await searchMedications(q);
  medLoading.style.display = 'none';
  lastResults = results;

  if (results.length === 0) {
    medResults.innerHTML = '<div class="result-empty">No matches found. <a id="med-no-match-manual">Enter manually</a></div>';
    medResults.classList.add('open');
    document.getElementById('med-no-match-manual').onclick = () => {
      medResults.classList.remove('open');
      showMedManualEntry();
    };
    return;
  }

  // The meta line names the source on purpose. An agent looking at a drug that
  // did not price the way they expected should be able to see which catalogue
  // it came from without reading JSON.
  medResults.innerHTML = results.map((r, i) => `
    <div class="result-item" data-idx="${i}">
      <div class="name">${escapeHtml(r.name || 'Unknown')}</div>
      <div class="meta">${r.provider === 'healthsherpa'
        ? escapeHtml(r.category || 'HealthSherpa')
        : 'RxCUI: ' + escapeHtml(r.rxcui)}</div>
    </div>
  `).join('');
  medResults.classList.add('open');

  medResults.querySelectorAll('.result-item').forEach(el => {
    el.onclick = () => {
      const r = lastResults[parseInt(el.dataset.idx, 10)];
      if (!r) return;
      if (r.provider === 'healthsherpa') selectMedicationHS(r);
      else selectMedication(r.rxcui, r.name);
    };
  });
}, DEBOUNCE_MS);

medSearchInput.addEventListener('input', (e) => runMedSearch(e.target.value.trim()));

document.addEventListener('click', (e) => {
  if (!medSearchInput.contains(e.target) && !medResults.contains(e.target)) {
    medResults.classList.remove('open');
  }
});

async function selectMedication(rxcui, name) {
  medResults.classList.remove('open');
  medSearchInput.value = name;
  medLoading.style.display = 'block';

  const details = await getDrugDetails(rxcui);
  medLoading.style.display = 'none';

  if (details.strengthOptions.length === 0) {
    state.medPending = { rxcui, name, brand_name: details.brandNames[0] || null, strengthOptions: [{ rxcui, name, type: 'BASE' }] };
  } else {
    state.medPending = { rxcui, name, brand_name: details.brandNames[0] || null, strengthOptions: details.strengthOptions };
  }

  medStrengthSelect.innerHTML = state.medPending.strengthOptions
    .map((s, i) => `<option value="${i}">${escapeHtml(s.name)}</option>`)
    .join('');

  medStrengthBlock.style.display = 'block';
  medSearchBlock.style.display = 'none';
}

/** HealthSherpa's equivalent of selectMedication. No second network call: their
 *  search already returns the dosage variations nested on the entity, so the
 *  strength picker is populated from what we have. */
function selectMedicationHS(entity) {
  medResults.classList.remove('open');
  medSearchInput.value = entity.name;

  state.medPending = {
    provider: 'healthsherpa',
    hs_rx_id: entity.hs_rx_id,
    name: entity.name,
    // 🩸 NOT entity.category. substance_name is a category string, not a brand.
    brand_name: null,
    strengthOptions: dosageOptionsHS(entity)
  };

  medStrengthSelect.innerHTML = state.medPending.strengthOptions
    .map((s, i) => `<option value="${i}">${escapeHtml(s.name)}</option>`)
    .join('');

  medStrengthBlock.style.display = 'block';
  medSearchBlock.style.display = 'none';
}

document.getElementById('med-cancel').onclick = () => resetMedSearch();

document.getElementById('med-add').onclick = async () => {
  if (!state.medPending) return;
  const idx = parseInt(medStrengthSelect.value, 10);
  const selected = state.medPending.strengthOptions[idx];
  const parsed = parseDrugName(selected.name);
  const frequency = resolveFreq(medFreqSelect, medFreqOther);
  if (frequency === null) return; // "Other" selected but no text entered
  const applicant_name = document.getElementById('med-applicant').value.trim() || null;
  const { quantity, days_supply } = readQtyDays('med-quantity', 'med-days-supply');

  const isHS = state.medPending.provider === 'healthsherpa';

  // 🩸 rxcui and ndc are RxNorm-only. In HS mode they stay null rather than
  // being filled from anything on the HS entity: the namespaces are disjoint,
  // and a wrong code here is worse than a missing one. Likewise hs_rx_id is
  // null on the RxNorm path. Exactly one of the two is ever populated, and
  // `source` says which.
  const ndc = isHS ? null : await getNdcForRxcui(selected.rxcui);

  const isBranded = !isHS && selected.type === 'SBD';
  const entry = {
    id: `med_${Date.now()}`,
    // 🩸 HS MODE USES THE FULL VARIATION NAME, and the verbosity is the point.
    // The family name is shared across dosages ("Lyumjev: Insulin Lispro Pen
    // Injector" covers both the 100 and the 200 Unt/Ml), so naming the row after
    // it renders two GENUINELY DIFFERENT drugs as identical cards and the agent
    // reasonably concludes they double-added. It also matches exactly the string
    // they just picked from the dosage dropdown, so nothing changes under them.
    name: isHS
      ? selected.name
      : (isBranded ? state.medPending.name : selected.name.split(/\s+\d/)[0].trim()),
    brand_name: isBranded ? state.medPending.name : (state.medPending.brand_name || null),
    // 🩸 NOT PARSED IN HS MODE. parseDrugName is tuned to RxNorm's naming and
    // reads the FIRST number it finds, which on a HealthSherpa product string is
    // the package size rather than the dose: "Lyumjev: 3 Ml ... 100 Unt/Ml Pen
    // Injector" yields "3 ml", the pen volume, for BOTH the 100 and the 200
    // strength. A confidently wrong strength on screen is worse than none, and
    // the full name above already carries the real dosage.
    strength: isHS ? null : parsed.strength,
    dosage_form: isHS ? null : parsed.dosageForm,
    frequency,
    applicant_name,
    quantity,
    days_supply,
    rxcui: isHS ? null : selected.rxcui,
    ndc,
    // The HealthSherpa drug id, and the entire point of HS mode. It is what
    // rides the quote deeplink as rx_records[]=<id>f.
    hs_rx_id: isHS ? selected.hs_rx_id : null,
    source: isHS ? 'healthsherpa' : 'rxnorm',
    display_name: selected.name
  };

  state.medications.push(entry);
  renderMedications();
  resetMedSearch();
};

function resetMedSearch() {
  state.medPending = null;
  medSearchInput.value = '';
  document.getElementById('med-applicant').value = '';
  // clear the optional pricing inputs on BOTH paths, so a value typed for one drug can never
  // ride along onto the next one the agent adds
  ['med-quantity','med-days-supply','med-manual-quantity','med-manual-days-supply']
    .forEach(id => { document.getElementById(id).value = ''; });
  // reset both frequency selects + their "Other" specify fields
  medFreqSelect.value = 'Once daily';
  medFreqOther.value = '';
  medFreqOther.classList.remove('err');
  medFreqOtherWrap.style.display = 'none';
  medManualFreqSelect.value = 'Once daily';
  medManualFreqOther.value = '';
  medManualFreqOther.classList.remove('err');
  medManualFreqOtherWrap.style.display = 'none';
  medStrengthBlock.style.display = 'none';
  medSearchBlock.style.display = 'block';
  medManualBlock.style.display = 'none';
}

function showMedManualEntry() {
  medSearchBlock.style.display = 'none';
  medStrengthBlock.style.display = 'none';
  medManualBlock.style.display = 'block';
}

document.getElementById('med-manual-toggle').onclick = (e) => { e.preventDefault(); showMedManualEntry(); };
document.getElementById('med-manual-cancel').onclick = resetMedSearch;

document.getElementById('med-manual-add').onclick = () => {
  const name = document.getElementById('med-manual-name').value.trim();
  if (!name) { alert('Medication name is required.'); return; }
  const frequency = resolveFreq(medManualFreqSelect, medManualFreqOther);
  if (frequency === null) return; // "Other" selected but no text entered
  const entry = {
    id: `med_${Date.now()}`,
    name,
    brand_name: null,
    strength: document.getElementById('med-manual-strength').value.trim() || null,
    dosage_form: document.getElementById('med-manual-form').value.trim() || null,
    frequency,
    applicant_name: document.getElementById('med-manual-applicant').value.trim() || null,
    ...readQtyDays('med-manual-quantity', 'med-manual-days-supply'),
    rxcui: null,
    ndc: null,
    source: 'manual',
    display_name: name
  };
  state.medications.push(entry);
  ['med-manual-name','med-manual-strength','med-manual-form','med-manual-applicant',
   'med-manual-quantity','med-manual-days-supply'].forEach(id => document.getElementById(id).value = '');
  renderMedications();
  resetMedSearch();
};

function renderMedications() {
  const list = document.getElementById('med-list');
  const count = state.medications.length;
  document.getElementById('med-count').textContent = `${count} of ${MAX_MEDS}`;

  list.innerHTML = state.medications.map(m => {
    const parts = [];
    if (m.brand_name && m.brand_name.toLowerCase() !== m.name.toLowerCase()) {
      parts.push(`${escapeHtml(m.name)} (${escapeHtml(m.brand_name)})`);
    } else {
      parts.push(escapeHtml(m.name));
    }
    if (m.strength) parts.push(escapeHtml(m.strength));
    if (m.dosage_form) parts.push(escapeHtml(m.dosage_form));
    const manualBadge = m.source === 'manual' ? '<span class="item-card-badge">Manual</span>' : '';
    const metaParts = [escapeHtml(m.frequency)];
    if (posInt(m.quantity) && posInt(m.days_supply)) metaParts.push(`${posInt(m.quantity)} per ${posInt(m.days_supply)} days`);
    if (m.applicant_name) metaParts.push(`for ${escapeHtml(m.applicant_name)}`);
    return `
      <div class="item-card ${m.source === 'manual' ? 'manual' : ''}">
        <div class="item-card-main">
          <div class="item-card-name">${parts.join(' ')}${manualBadge}</div>
          <div class="item-card-meta">${metaParts.join(' · ')}</div>
        </div>
        <button class="danger-text" data-remove-med="${m.id}">Remove</button>
      </div>
    `;
  }).join('');

  list.querySelectorAll('[data-remove-med]').forEach(btn => {
    btn.onclick = () => {
      state.medications = state.medications.filter(m => m.id !== btn.dataset.removeMed);
      renderMedications();
    };
  });

  if (count >= MAX_MEDS) {
    medSearchBlock.style.display = 'none';
    medStrengthBlock.style.display = 'none';
    medManualBlock.style.display = 'none';
  } else if (!state.medPending && medManualBlock.style.display === 'none') {
    medSearchBlock.style.display = 'block';
  }

  syncHiddenFields();
}

// ============================================================
// JSON + SUMMARY BUILDERS
// ============================================================
// version 1.1 adds quantity + days_supply. The bump matters: a 1.0 row and a 1.1 row where the
// agent left both blank are byte-identical, so without it nothing downstream could tell "captured
// before these fields existed" from "captured after and left empty".
function buildMedicationsJson() {
  return JSON.stringify({
    // 1.2 adds hs_rx_id. The stamp is bumped because a reader otherwise cannot
    // tell "captured before HealthSherpa ids existed" from "captured after, but
    // this drug is not in their catalogue", and those call for opposite
    // responses. Same reasoning that put 1.1 on the quantity change.
    version: '1.2',
    count: state.medications.length,
    items: state.medications.map(m => ({
      id: m.id, name: m.name, brand_name: m.brand_name,
      strength: m.strength, dosage_form: m.dosage_form, frequency: m.frequency,
      applicant_name: m.applicant_name || null,
      quantity: posInt(m.quantity),
      days_supply: posInt(m.days_supply),
      // 🩸 ADDITIVE. rxcui and ndc are kept exactly as they were so an existing
      // RxNorm-captured book is not rewritten, and so a future HealthSherpa
      // crosswalk (if they ever supply one) stays usable. hs_rx_id sits
      // alongside them; it is never derived from them.
      rxcui: m.rxcui, ndc: m.ndc,
      hs_rx_id: m.hs_rx_id || null,
      source: m.source
    }))
  });
}

function buildMedicationsSummary() {
  if (state.medications.length === 0) return '';
  const lines = [`MEDICATIONS (${state.medications.length})`, ''];
  for (const m of state.medications) {
    const parts = [];
    if (m.brand_name && m.brand_name.toLowerCase() !== m.name.toLowerCase()) parts.push(`${m.name} (${m.brand_name})`);
    else parts.push(m.name);
    if (m.strength) parts.push(m.strength);
    if (m.dosage_form) parts.push(m.dosage_form);
    let line = `• ${parts.join(' ')} — ${m.frequency}`;
    // Both or neither: a quantity with no days supply is not a pricing input, it is just a number.
    if (posInt(m.quantity) && posInt(m.days_supply)) line += `, ${posInt(m.quantity)} per ${posInt(m.days_supply)} days`;
    if (m.applicant_name) line += ` (for ${m.applicant_name})`;
    if (m.source === 'manual') line += ' [manually entered]';
    lines.push(line);
  }
  return lines.join('\n');
}

function syncHiddenFields() {
  if (!syncReady) return; // skip the bootstrap write so hydrate can't be clobbered
  const setAll = (keys, value) => {
    for (const key of (Array.isArray(keys) ? keys : [keys])) {
      if (!key) continue;
      const selector = `[name="${key}"], [data-q="${key}"]`;
      document.querySelectorAll(selector).forEach(el => {
        el.value = value;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      });
    }
  };
  setAll(FIELD_KEYS.medications_json,    buildMedicationsJson());
  setAll(FIELD_KEYS.medications_summary, buildMedicationsSummary());
}

// ============================================================
// PRIMARY COLOR INHERITANCE
// ------------------------------------------------------------
// Resolution order (first valid wins):
//   1. window.<WIDGET>_CONFIG.primaryColor — explicit JS override
//   2. data-primary-color on the container. In GHL set this to the literal
//      {{custom_values.brand_primary_color}} — GHL substitutes the account's
//      brand color server-side (works on both forms and surveys).
//   3. Auto-detect: GHL form submit-button bg, then survey Next-button color.
//   4. Fallback: the widget's default --accent (#1e4d8c).
// Unresolved {{...}} merge tags are ignored (see isValidColor).
// ============================================================
function isValidColor(v) {
  if (!v || typeof v !== 'string') return false;
  const s = v.trim();
  if (!s) return false;
  if (s.includes('{{') || s.includes('}}')) return false;
  return /^#[0-9a-f]{3,8}$/i.test(s) || /^rgba?\(/i.test(s);
}

function applyPrimaryColor() {
  const widget = document.getElementById('medications-lookup-widget');
  if (!widget) return;
  let color = null;
  if (typeof window !== 'undefined' && window.MEDS_CONFIG && isValidColor(window.MEDS_CONFIG.primaryColor)) {
    color = window.MEDS_CONFIG.primaryColor;
  } else if (widget.dataset && isValidColor(widget.dataset.primaryColor)) {
    color = widget.dataset.primaryColor;
  } else {
    // No explicit color set — auto-detect the host's brand color.
    // Form-style: GHL forms put the brand color inline on the submit button bg.
    const formBtn = document.querySelector('button[type="submit"]');
    if (formBtn && isValidColor(formBtn.style.backgroundColor)) {
      color = formBtn.style.backgroundColor;
    }
    // Survey-style: the footer Next/Submit button. Prefer a filled background,
    // else fall back to the (brand-colored) text color GHL uses by default.
    if (!color) {
      const surveyBtn = document.querySelector(
        '.ghl-footer-next, .ghl-footer-previous, .ghl-footer-preview, .ghl-footer .ghl-btn'
      );
      if (surveyBtn) {
        const s = getComputedStyle(surveyBtn);
        const transparent = ['rgba(0, 0, 0, 0)', 'transparent', ''];
        const skipColors = [
          'rgb(0, 0, 0)', 'rgba(0, 0, 0, 0)', 'rgb(96, 113, 121)',
          'rgb(255, 255, 255)', 'rgba(255, 255, 255, 1)'
        ];
        const bg = s.backgroundColor;
        const fg = s.color;
        if (bg && !transparent.includes(bg) && !skipColors.includes(bg)) {
          color = bg;
        } else if (fg && !skipColors.includes(fg) && isValidColor(fg)) {
          color = fg;
        }
      }
    }
  }
  if (!color) return;
  const hex8 = color.match(/^#([0-9a-f]{8})$/i);
  if (hex8) color = '#' + hex8[1].substring(0, 6);
  widget.style.setProperty('--accent', color);
  widget.style.setProperty('--accent-hover', darken(color, 0.12));
}

function darken(color, amount) {
  let r, g, b;
  const hex = color.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  const rgb = color.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
  if (hex) {
    const h = hex[1].length === 3 ? hex[1].split('').map(c => c + c).join('') : hex[1];
    r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
  } else if (rgb) { r = +rgb[1]; g = +rgb[2]; b = +rgb[3]; } else { return color; }
  const d = v => Math.max(0, Math.round(v * (1 - amount))).toString(16).padStart(2, '0');
  return '#' + d(r) + d(g) + d(b);
}

// ============================================================
// HYDRATE — seed state from an existing field so selections APPEND
// ------------------------------------------------------------
// Reads the medications_json we previously wrote (round-trip safe), so a contact
// re-entering the funnel keeps their prior drugs instead of losing them. Bad or
// empty values are ignored. Dedups so a reload can't double an entry.
// ============================================================
function readFieldValue(keys) {
  // Scan ALL matches and return the first NON-EMPTY value. The widget injects its
  // own empty <input name="medications_json"> mirror, which is first in document
  // order — skipping empties lets us read GHL's prefilled [data-q] field instead.
  for (const key of (Array.isArray(keys) ? keys : [keys])) {
    if (!key) continue;
    const els = document.querySelectorAll(`[name="${key}"], [data-q="${key}"]`);
    for (const el of els) {
      if (el && el.value && el.value.trim()) return el.value;
    }
  }
  return '';
}

// Fallback hydration seed for RETURNING contacts (option C). GHL resolves a merge
// tag into the page and the widget reads it WITHOUT putting PHI in the URL.
// Unresolved {{...}} tags and empty values are ignored (falls through to empty).
// Preferred wiring on the embed page = a sibling JSON script element with
// type="application/json" and id="medications-lookup-widget-seed" whose text is
// {{ contact.custom.medications_json }}, placed BEFORE the embed script element.
// (Quote-safe: JSON in a script text node can't break the HTML the way a data-*
// attribute does — that attribute path was removed in v2.3.0.)
// NOTE: on GHL funnel/survey pages {{ contact.custom.* }} resolves from the
// visitor's local-storage of a PRIOR submission on that funnel (same browser) —
// it is NOT a cross-device / server-side-by-identity lookup.
function readInitialSeed() {
  const clean = v => {
    if (typeof v !== 'string') return '';
    const s = v.trim();
    if (!s || s.indexOf('{{') !== -1 || s.indexOf('}}') !== -1) return '';
    return s;
  };
  // Source 1 (PREFERRED, quote-safe): JSON inside a <script type="application/json"> tag.
  const seedTag = document.getElementById('medications-lookup-widget-seed');
  if (seedTag) {
    const s = clean(seedTag.textContent);
    if (s) return s;
  }
  // Source 2: explicit JS-global override.
  const cfg = (typeof window !== 'undefined' && window.MEDS_CONFIG) || {};
  return clean(cfg.initialMedications);
}

function hydrateFromField() {
  try {
    const raw = readFieldValue(FIELD_KEYS.medications_json) || readInitialSeed();
    if (!raw) return;
    const parsed = JSON.parse(raw);
    const items = parsed && Array.isArray(parsed.items) ? parsed.items : null;
    if (!items) return;
    // hs_rx_id joins the identity key. Without it, two genuinely different
    // HealthSherpa dosages of one product (which share a family name and carry
    // no rxcui) collapse into one row on hydrate and the agent silently loses a
    // drug they entered.
    const keyOf = m => [m.rxcui, m.hs_rx_id, m.name, m.strength, m.dosage_form, m.applicant_name].join('|');
    const seen = new Set(state.medications.map(keyOf));
    items.forEach((it, i) => {
      if (!it || !it.name) return;
      const m = {
        id: String(it.id != null ? it.id : 'hydrated-' + i),
        name: it.name,
        brand_name: it.brand_name || null,
        strength: it.strength || null,
        dosage_form: it.dosage_form || null,
        frequency: it.frequency || 'As directed',
        applicant_name: it.applicant_name || null,
        // carried through so a returning contact does not silently lose the pricing inputs;
        // posInt tolerates the string form in case an older writer stored them as text
        quantity: posInt(it.quantity),
        days_supply: posInt(it.days_supply),
        rxcui: it.rxcui || null,
        ndc: it.ndc || null,
        // 🩸 THIS LINE IS LOAD-BEARING. This function rebuilds every item from a
        // FIXED key list, so any field missing here is DESTROYED the next time a
        // returning visitor hydrates and the widget writes back. hs_rx_id is the
        // one field the quote deeplink depends on, so losing it silently empties
        // the drug filter on the quote with nothing to show why.
        hs_rx_id: it.hs_rx_id || null,
        source: it.source || 'lookup'
      };
      const k = keyOf(m);
      if (seen.has(k)) return;
      seen.add(k);
      state.medications.push(m);
    });
    if (state.medications.length > MAX_MEDS) state.medications.length = MAX_MEDS;
  } catch (e) { /* ignore malformed existing value */ }
}

applyPrimaryColor();
hydrateFromField();
renderMedications();
syncReady = true;
</script>
</body>
</html>
