<!-- ============================================================
     doc-rx-lookup — generic GHL embeds for the quote form/survey
     Paste each block into its own Custom Code / Custom HTML element.
     - Color comes from the account's {{custom_values.brand_primary_color}}.
     - Pin @vX.Y.Z to a real tag (not @main). Current stable = v2.4.2
       (>= v2.3.0 required for the seed). Rx-frequency "Other" reveals a required
       free-text specify that folds into the summary (no new field, no wiring
       change). The income widget has no "Other" popup — its Source/Employer field
       is optional and is where an "Other" source gets described (popup removed in v2.4.2).
     - Test on the PUBLISHED form/survey (GHL preview may not run <script>).
     - The page must also contain the matching custom fields as inputs
       (hidden is fine) — see SNAPSHOT-FIELDS.md.

     OPTIONAL — returning-contact APPEND (v2.3.0), PHI stays OUT of the URL:
     the <script type="application/json" ...-seed> line carries the contact's
     previously-saved value so the widget hydrates + appends instead of
     replacing. GHL resolves the merge tag into the JSON script tag server-side
     (quote-safe — a <script> text node can't break the HTML). Unresolved
     {{...}} is ignored, so it is safe to leave in for new contacts too.
     IMPORTANT: the seed <script> MUST sit BEFORE the embed <script> (it is read
     at bootstrap). Do NOT nest <script> inside the <div> — keep them siblings.
     REACH: {{ contact.custom.* }} on a funnel/survey resolves from the visitor's
     local-storage of a PRIOR submission on that funnel (same browser) — it is
     not a cross-device / server-side-by-identity lookup. Omit the seed line to
     skip the feature entirely.
     ============================================================ -->

<!-- Doctors / Providers  ->  providers_json, providers_summary -->
<div id="provider-lookup-widget" data-primary-color="{{custom_values.brand_primary_color}}"></div>
<script type="application/json" id="provider-lookup-widget-seed">{{ contact.custom.providers_json }}</script>
<script src="https://cdn.jsdelivr.net/gh/maxmethod/doc-rx-lookup@vX.Y.Z/dist/embed-providers.js"></script>

<!-- Medications / Rx  ->  medications_json, medications_summary -->
<div id="medications-lookup-widget" data-primary-color="{{custom_values.brand_primary_color}}"></div>
<script type="application/json" id="medications-lookup-widget-seed">{{ contact.custom.medications_json }}</script>
<script src="https://cdn.jsdelivr.net/gh/maxmethod/doc-rx-lookup@vX.Y.Z/dist/embed-medications.js"></script>

<!-- Current Coverage  ->  current_coverage_json, current_coverage_summary -->
<div id="coverage-lookup-widget" data-primary-color="{{custom_values.brand_primary_color}}"></div>
<script type="application/json" id="coverage-lookup-widget-seed">{{ contact.custom.current_coverage_json }}</script>
<script src="https://cdn.jsdelivr.net/gh/maxmethod/doc-rx-lookup@vX.Y.Z/dist/embed-coverage.js"></script>

<!-- Income Sources  ->  income_json, income_summary, household_income (auto-total) -->
<div id="income-sources-widget" data-primary-color="{{custom_values.brand_primary_color}}"></div>
<script type="application/json" id="income-sources-widget-seed">{{ contact.custom.income_json }}</script>
<script src="https://cdn.jsdelivr.net/gh/maxmethod/doc-rx-lookup@vX.Y.Z/dist/embed-income.js"></script>


<!-- ============================================================
     STAGING RETARGET (2026-09-06) — makes the survey write NON-DESTRUCTIVE.
     Paste this ONE block ABOVE the widget blocks above, in the same Custom HTML
     element or an earlier one on the same step.

     WHAT IT FIXES. The widget writes its WHOLE current list on every change. When
     the hydration seed does not resolve — which is the common case for drip
     traffic, not the rare one — the widget starts empty, the client adds two
     doctors, and the eight already on the contact are replaced by two. Tested and
     confirmed 2026-09-05; the seed cannot be made to resolve for that traffic.

     WHAT IT DOES. Points the widget's WRITE at a staging field. The canonical
     field is then only ever written by the policy-sync merge
     (POST /webhooks/rx/merge), which can add to the stored list and cannot
     shrink it. FIELD_KEYS is read at parse time, so this needs NO new CDN tag
     and does NOT change a funnel's existing @vX.Y.Z pin.

     TWO NEW FIELDS, NOT FOUR. There is deliberately no staging SUMMARY field:
     the summary is derived, and the merge regenerates the canonical one from the
     merged items, so a staging summary would never be read. The summary write is
     suppressed with an empty array instead.

     🩸 THE [] IS NOT A TYPO AND MUST STAY AN EMPTY ARRAY. setAll iterates
     (Array.isArray(keys) ? keys : [keys]), so [] is a ZERO-ITERATION loop and the
     summary write provably reaches nothing. Do not replace it with a placeholder
     key name to make the config look symmetrical: a placeholder still runs a
     querySelectorAll and merely relies on nothing matching, and any real field
     name you invent becomes PERMANENT on ~60 accounts, because a snapshot cannot
     delete a field.

     Why not just leave providers_summary pointing at itself: the widget injects
     its OWN <input type="hidden" name="providers_summary"> INSIDE GHL's form, and
     that input CANNOT be removed without a new CDN build. So the key keeps
     matching an element even after the GHL field is taken off the survey.

     ⚠️ REMOVE THE CANONICAL FIELDS FROM THIS SURVEY, and understand the mechanism
     precisely, because an earlier draft of this note stated it wrongly. What
     submits a value is a GHL FIELD BOUND ON THAT STEP, not merely an input
     carrying that name. The distinction matters: the widget's own hidden mirror
     named providers_json is unremovable, so if a bare name were enough to submit,
     the retarget below would itself blank canonical on every submission. The
     design assumes the mirror is INERT and only GHL's bound field submits.

     🩸 THAT ASSUMPTION IS UNMEASURED. Test it once before rolling out: see
     "Step 0" in mm-policy-sync/infra/RX_MERGE_SETUP.md. If the mirror turns out
     NOT to be inert, this whole staging approach needs rework, because the
     offending input cannot be taken off the page.

     Remove providers_json, providers_summary, medications_json and
     medications_summary from the survey, and add the two *_json_staging fields in
     their place. Removing a field FROM A SURVEY does not delete it: the canonical
     fields stay on the contact and keep their data.

     ⚠️ A widget only writes into a field that is ON THE SAME STEP it sits on.
     Both staging fields must be present (hidden is fine) on the step carrying the
     widgets, exactly as SNAPSHOT-FIELDS.md describes for the canonical ones.

     THE SEED LINE STAYS AND IS STILL HARMLESS. With the retarget in place the
     widget reads the (empty) staging field, falls through to the seed, and if
     the seed happens to resolve it hydrates and writes that same list back to
     staging — where the merge dedups it to a no-op. Seed resolves or not, the
     stored list only grows.
     ============================================================ -->
<script>
  window.PROV_CONFIG = { fieldKeys: {
    providers_json:      ['providers_json_staging'],
    providers_summary:   [] } };
  window.MEDS_CONFIG = { fieldKeys: {
    medications_json:    ['medications_json_staging'],
    medications_summary: [] } };
</script>
