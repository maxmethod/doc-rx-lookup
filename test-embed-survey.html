<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embed Test: Doctors + Medications in a GHL survey (or form with ?mode=form)</title>
<!--
  Mirrors the live GHL survey DOM read on 2026-10-16 from the v4.0 master OEP survey render:
  every slide stays in the DOM and only the current one is display:block; the hidden fields are
  textareas keyed by data-q; NEXT is div.ghl-btn.ghl-footer-next (role=button, an SVG arrow inside)
  whose own click handler validates and advances. The handler below records what the fields hold
  at the moment it runs, which is what GHL keeps. ?mode=form swaps the footer for a GHL-style form
  with button[type=submit]. Results land in window.__harnessLog and on the last slide.
-->
<style>
  body { font-family: Roboto, sans-serif; margin: 0; background: #eef1f5; }
  .ghl-survey { max-width: 640px; margin: 0 auto; background: #fff; min-height: 100vh; }
  .ghl-question { display: none; padding: 16px; }
  .ghl-page-current { display: block; }
  .ghl-question h3 { font-size: 18px; margin: 0 0 12px; }
  .ghl-question input.ghl-text { font-size: 18px; width: 100%; padding: 8px; box-sizing: border-box; }
  .ghl-footer { display: flex; justify-content: flex-end; height: 50px; border-top: 1px solid #ddd; }
  .ghl-footer-next { width: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0006b4; }
  form button[type="submit"] { margin: 16px; padding: 12px 24px; font-size: 16px; background: #0006b4; color: #fff; border: 0; border-radius: 4px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: #f6f6f6; padding: 8px; }
</style>
</head>
<body>
<div class="ghl-survey">
  <form id="ghl-form" onsubmit="return false;">
    <div class="ghl-question slide-no-1 ghl-page-current">
      <h3>Doctors</h3>
      <div id="provider-lookup-widget" data-primary-color="#0006b4"></div>
      <textarea data-q="providers_json" name="FIELD_PROV_JSON" style="display:none"></textarea>
      <textarea data-q="providers_summary" name="FIELD_PROV_SUM" style="display:none"></textarea>
    </div>
    <div class="ghl-question slide-no-2">
      <h3>Medications</h3>
      <div id="medications-lookup-widget" data-primary-color="#0006b4"></div>
      <textarea data-q="medications_json" name="FIELD_MED_JSON" style="display:none"></textarea>
      <textarea data-q="medications_summary" name="FIELD_MED_SUM" style="display:none"></textarea>
    </div>
    <div class="ghl-question slide-no-3">
      <h3>Notes</h3>
      <input class="ghl-text" type="text" placeholder="A GHL field at 18px">
      <pre id="harness-out"></pre>
    </div>
    <button type="submit" id="harness-submit" style="display:none">Submit</button>
  </form>
  <div class="ghl-footer" id="harness-footer">
    <div role="button" tabindex="0" class="ghl-btn ghl-footer-next" aria-label="NEXT">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h10M10 5l4 4-4 4"/></svg>
    </div>
  </div>
</div>

<script>
  window.__harnessLog = [];
  const count = q => {
    const v = document.querySelector(`[data-q="${q}"]`).value;
    try { return JSON.parse(v).count; } catch (e) { return v ? 'unparsed' : 0; }
  };
  function record(event) {
    const entry = {
      event,
      slide: document.querySelector('.ghl-page-current').className.match(/slide-no-\d+/)[0],
      providers: count('providers_json'),
      medications: count('medications_json'),
      medications_json: document.querySelector('[data-q="medications_json"]').value
    };
    window.__harnessLog.push(entry);
    document.getElementById('harness-out').textContent = JSON.stringify(window.__harnessLog, null, 2);
  }
  const formMode = new URLSearchParams(location.search).get('mode') === 'form';
  if (formMode) {
    // A GHL form: everything on one page, a real submit button.
    document.querySelectorAll('.ghl-question').forEach(s => { s.style.display = 'block'; });
    document.getElementById('harness-footer').style.display = 'none';
    const btn = document.getElementById('harness-submit');
    btn.style.display = '';
    btn.addEventListener('click', () => record('form-submit-click'));
  } else {
    // GHL's handler sits on the button itself (bubble phase on the target), like the live survey.
    document.querySelector('.ghl-footer-next').addEventListener('click', () => {
      const cur = document.querySelector('.ghl-page-current');
      record('next-click');
      const next = cur.nextElementSibling;
      if (next && next.classList.contains('ghl-question')) {
        cur.classList.remove('ghl-page-current');
        next.classList.add('ghl-page-current');
      }
    });
  }

  // ?v=v2.6.1 loads that released tag from jsDelivr instead of the local build, to compare.
  const tag = new URLSearchParams(location.search).get('v');
  const base = tag ? `https://cdn.jsdelivr.net/gh/maxmethod/doc-rx-lookup@${tag}/` : './';
  for (const f of ['dist/embed-providers.js', 'dist/embed-medications.js']) {
    const s = document.createElement('script');
    s.src = base + f;
    s.async = false;
    document.body.appendChild(s);
  }
</script>
</body>
</html>
